format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$go\
$python\
$lua\
$character"""

[username]
format = '[$user]($style) '
style_user = 'mauve'
style_root = 'mauve'
disabled = false
show_always = true
aliases = {"ianwatkins" = " MistbornOne" }

[directory]
style = "lavender"
home_symbol = "~"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[x](bold red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bold mauve"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "lavender"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "green"

[golang]
format = "via [$symbol($version )]($style)"
detect_files = ['go.mod', 'go.sum', 'go.work', 'glide.yaml', 'Gopkg.yml', 'Gopkg.lock', '.go-version']
style = "bold sapphire"
not_capable_style = "red"

[lua]
format = 'via [$symbol($version )]($style)'
style = "blue"


